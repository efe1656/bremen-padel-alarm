name: Padel-Wecker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose = nur lesen; check = prüfen und melden; setup = Telegram koppeln'
        required: true
        default: diagnose
        type: choice
        options: [diagnose, check, setup]

permissions:
  contents: write

concurrency:
  group: padelwecker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python-Pakete installieren
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m unittest -v

      - name: Browser und virtuellen Bildschirm installieren
        if: inputs.mode != 'setup'
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: Prüfen oder koppeln
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PAIR_CODE: ${{ secrets.TELEGRAM_PAIR_CODE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOOKING_DAYS: '21'
          RUN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$RUN_MODE" = "setup" ]; then
            python watcher.py "$RUN_MODE"
          else
            xvfb-run -a python watcher.py "$RUN_MODE"
          fi

      - name: Gemeldete Treffer merken
        if: always() && inputs.mode == 'check'
        run: |
          if [ -f state.json ]; then
            git config user.name 'Padel-Wecker'
            git config user.email 'padelwecker@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Gemeldete Padel-Angebote aktualisieren'
              git push
            fi
          fi
